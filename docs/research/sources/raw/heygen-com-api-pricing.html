    <!-- Meta click cookie from ?fbclid before anything can navigate away: GTM (and its pixel) loads
         only after LCP, so visitors who left first reached Meta without the ad click. Same format the
         pixel writes (fb.1.<ms>.<fbclid>); a valid _fbc holding this fbclid keeps its click time. Kept
         in sync with web-marketing apps/next-2025/src/utils/analytics/metaFbc.ts. -->
    <script>
      (function () {
        if (location.pathname !== '/oauth/authorize' || new URLSearchParams(location.search).get('flow') !== 'video-download') return;
        window.__heygenVideoDownloadHandoff = true;
        try {
          var token = new URLSearchParams(location.hash.slice(1)).get('token');
          if (token && token.length <= 2048) window.__heygenDownloadHandoffToken = token;
          history.replaceState(history.state, '', location.pathname + location.search);
        } catch (_) {}
        var referrer = document.createElement('meta');
        referrer.name = 'referrer';
        referrer.content = 'no-referrer';
        document.head.appendChild(referrer);
      })();

      // Webview landing escape arrival (src/business/webviewEscape): keep the escape id as a cookie
      // for the server's Meta click lookup, and drop the params before anything reads the URL.
      // SameSite=None: Safari's Google sign-in returns by a cross-site POST, which drops Lax cookies.
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var id = params.get('wv_escape');
          if (id === null) return;
          var cta = params.get('wv_cta') || '';
          params.delete('wv_escape');
          params.delete('wv_cta');
          var qs = params.toString();
          history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
          // Android's intent fallback reopens the page in the webview itself: not an arrival.
          if (/\bInstagram\b|FBAN\/|FB_IAB\/|FBAV\//.test(navigator.userAgent)) return;
          if (!/^[A-Za-z0-9_-]{16,64}$/.test(id) || !/^[a-z0-9_]{1,40}$/.test(cta)) return;
          var h = location.hostname;
          var shared = h === 'heygen.com' || h.slice(-11) === '.heygen.com';
          document.cookie = 'heygen_wv_escape=' + id + '; path=/' + (shared ? '; domain=.heygen.com' : '') +
            '; max-age=604800; SameSite=None; Secure';
          window.__heygenWebviewEscapeArrival = { escapeId: id, cta: cta, path: location.pathname };
        } catch (e) {}
      })();

      (function () {
        try {
          var m = /[?&]fbclid=([^&]*)/.exec(location.search);
          if (!m) return;
          var id = decodeURIComponent(m[1].replace(/\+/g, ' '));
          if (!/^[A-Za-z0-9_-]{1,480}$/.test(id)) return;
          var ts = 0;
          document.cookie.split('; ').forEach(function (c) {
            var p = c.indexOf('_fbc=') === 0 ? c.slice(5).split('.') : [];
            if (p[0] === 'fb' && /^\d{10,13}$/.test(p[2]) && p[3] === id) ts = p[2];
          });
          var h = location.hostname;
          var shared = h === 'heygen.com' || h.slice(-11) === '.heygen.com';
          // A host-only copy would shadow the shared one here, so it goes before the shared one is written.
          if (shared) document.cookie = '_fbc=; path=/; max-age=0';
          document.cookie = '_fbc=fb.1.' + (ts || Date.now()) + '.' + id + '; path=/' + (shared ? '; domain=.heygen.com' : '') +
            '; max-age=7776000; SameSite=Lax; Secure';
        } catch (e) {}
      })();
    </script>

         of parser state; a classic inline script instead blocks on any stylesheet
         earlier in the document, so sitting below critical.css would start the /home
         LCP fetch a same-origin round trip later than the tag it replaces. -->
    <!-- LCP element on /home: SAHome background ORB logo (img.sa-bg-logo in
         SAHome.tsx). Preload at HTML parse so the image fetch starts before
         JS parses + React mounts the <img>. URL must match the one in
         SAHome.tsx exactly — both reference the same ImageKit cache key.
         Pathname-gated like the /apps block below: as a static <link> this
         fetched at fetchpriority=high on every route, and the ORB renders on
         only a few. The gate covers every surface that mounts it:
           /home              SAHome (and its lazy SADesignAMore child)
           /home/real-estate  home-real-estate/index.tsx renders the same URL
           /video-agent       VAHome returns <SAHome/> on the va-super-agent arm
           /apps/video-agent  VideoAgent -> HomeAgentPage -> VAHome -> SAHome on
                              the home-v3-video-creation-flow arm; off-arm it
                              redirects to /home, which renders SAHome anyway
           /                  LoginRedirectWrapper client-side navigates an
                              authed visitor to /home in this same document, so
                              the preload still warms that render.
         Trailing slashes are stripped first — React Router matches /home/ and
         /video-agent/ to the same routes, so an exact-equality gate would miss
         them. A leading /guest is stripped for the same reason: helpers/utils.ts
         pathWithVisitor() builds every guest URL as '/guest' + path, and master
         preloaded this ORB from an ungated static tag, so gating without the
         strip would lose the preload on /guest/home against shipped behaviour. -->
    <script>
      (function () {
        try {
          var p = location.pathname
            .replace(/^\/guest(?=\/|$)/, '')
            .replace(/\/+$/, '') || '/';
          if (
            p !== '/' &&
            p !== '/home' &&
            p.indexOf('/home/') !== 0 &&
            p !== '/video-agent' &&
            p !== '/apps/video-agent'
          )
            return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = 'https://dynamic.heygen.ai/app/branding/PRISM_ORB.png?tr=f-auto,q-50,w-100';
          l.fetchPriority = 'high';
          document.head.appendChild(l);
        } catch (e) {
          /* noop */
        }
      })();
    </script>
    <!-- Retry failed CSS preloads from Vite's dynamic import system.
         Vite's __vitePreload caches attempted CSS in a `seen` map, so retrying
         the import() alone won't re-fetch the CSS. This handler creates a fresh
         <link> element for the failed stylesheet. JS retry is handled by the
         retryDynamicImportsPlugin Vite plugin (viteplugin/retry-dynamic-imports.ts). -->
    <script>
      // Retry a function up to maxRetries times with exponential backoff.
      // Final attempt runs without error handling so failures propagate normally.
      function retryWithBackoff(fn, maxRetries, baseDelay) {
        return function load(attempt) {
          var p = fn();
          if (attempt < maxRetries) p.catch(function() {
            setTimeout(function() { load(attempt + 1); }, baseDelay * Math.pow(2, attempt));
          });
        };
      }

      // Retry failed CSS preloads from Vite's dynamic import system.
      // Vite's __vitePreload caches attempted CSS in a `seen` map, so retrying
      // the import() alone won't re-fetch the CSS. This handler creates a fresh
      // <link> element for the failed stylesheet.
      window.addEventListener('vite:preloadError', function(e) {
        var err = e.payload;
        if (err && err.message) {
          var match = err.message.match(/Unable to preload CSS for (\/[^\s]+)/);
          if (match && match[1].charAt(0) === '/') {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = match[1];
            document.head.appendChild(link);
            e.preventDefault();
          }
        }
      });
    </script>

    <!-- LCP element on /apps: a FeaturedHeroCards.tsx <img> (the previewImage
         of a featured app from appCatalog.ts). The cards are JSX-rendered, so
         the preload scanner can't see the URLs until React mounts the lazy
         /apps view — injecting the preloads here moves the image fetch into
         the network-idle window while the JS bundle still evaluates. Gated on
         pathname so other routes don't pay the bytes.
         Slot order is the apps-config payload's featuredOrder — b-roll,
         video-podcast-v2, filler-word-removal.
         DEFAULT_FEATURED_APP_IDS (slot 2 = instant-highlights) is NOT the
         order to preload for, even though advanced_disable_feature_flags_on_
         first_load (helpers/analyze/posthog.ts) skips the first-load flag
         fetch for signed-in users. What backfills the payload is the
         account.get bootstrap in useAccountControl.ts: receivedFeatureFlags()
         seeds server-evaluated flags synchronously, with a setTimeout(0)
         reloadFeatureFlags() as backstop. Do NOT rest this on identify() —
         posthog.ts only calls it when hasUserPropsDiff() is true, so a
         returning user with stable props never re-requests that way.
         b-roll (the mobile LCP element, always slot 1) preloads on every
         viewport; slots 2-3 only at >=768px, where the grid is 3-up and the
         cards are above the fold (any equal-size card image can win the LCP
         race). On mobile the grid is 1-up, so the rest are below the fold.
         No fetchpriority=high: image preloads default below scripts, so the
         eager JS wave isn't contended on slow links. URLs must byte-match
         appCatalog.ts or the preload is wasted — pinned by
         src/layout/home/sections/tools/appsLcpPreload.test.ts. -->

    <!-- Pre-hydrate skeleton — a centered spinner that paints instantly from
         HTML so FCP fires before the JS bundle executes. The inline SVG
         <circle> counts as contentful content per the paint-timing spec, so
         FCP fires on the first frame.
         Spinner CSS replicates @pacific/heygen-design's <Spinner> exactly:
         - hv-rotate (1.4s linear) on the SVG element
         - hv-dash (1.4s ease-in-out) on the stroke-dasharray
         - color rgba(0,196,255,1), thickness 13% of size
         Sibling of #root so React's createRoot().render() doesn't nuke it.
         Removed via MutationObserver on mount; opacity-only fade. -->
    <style>
      #hv-boot-skeleton {
        position: fixed; inset: 0; z-index: 9999; pointer-events: none;
        /* Matches --fill-general (the app's main bg, white in light mode). */
        background: #ffffff;
      }
      [data-theme="dark"] #hv-boot-skeleton { background: #16171a; }
      /* Spinner — matches @pacific/heygen-design <Spinner> exactly. */
      #hv-boot-skeleton .hv-spinner {
        position: absolute; left: 50%; top: 50%;
        width: 48px; height: 48px;
        margin: -24px 0 0 -24px;
      }
      #hv-boot-skeleton .hv-spinner svg {
        width: 100%; height: 100%;
        animation: hv-rotate 1.4s linear infinite;
      }
      #hv-boot-skeleton .hv-spinner circle {
        stroke: rgba(0,196,255,1);
        stroke-width: 6.24; /* 13% of size 48 */
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 80px, 200px;
        stroke-dashoffset: 0px;
        animation: hv-dash 1.4s ease-in-out infinite;
      }
      @keyframes hv-rotate { 100% { transform: rotate(360deg); } }
      @keyframes hv-dash {
        0%   { stroke-dasharray: 1px, 200px; stroke-dashoffset: 0px; }
        50%  { stroke-dasharray: 100px, 200px; stroke-dashoffset: -15px; }
        100% { stroke-dasharray: 100px, 200px; stroke-dashoffset: -125px; }
      }
    </style>
    <div id="hv-boot-skeleton" aria-hidden="true">
